# Builds installable Malgel packages for macOS, Windows and Linux.
#
# Pushing a tag vX.Y.Z (matching the version in Cargo.toml) publishes a
# GitHub Release with every package. Running the workflow by hand puts them
# all on a draft release named for the run ("test build") instead. The macOS
# job attaches its disk image to the draft itself rather than handing it
# over as an artifact, so it doesn't depend on GitHub-hosted runners or
# Actions artifact storage. Code signing and notarization happen
# when the repository secrets described in docs/RELEASING.md are set;
# without them the macOS app is signed ad hoc and the Windows files are
# unsigned.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version from Cargo.toml
        id: version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "Version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    # The repository variable MACOS_RUNNER picks another macOS runner, such
    # as GetMac's; GitHub's macOS 14 runner otherwise. The job checks the
    # version itself rather than waiting on a GitHub-hosted job, so it runs
    # wherever its runner is available.
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-14' }}
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # A certificate exported with a blank password is fine, so the
      # password may be empty.
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      HAS_NOTARY: ${{ (secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '') || (secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '') }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version from Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "::error::No version found in Cargo.toml"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "Version $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "DMG=Malgel-$version-macos-universal.dmg" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      # Compiled dependencies, restored so a release rebuilds little but
      # Malgel itself. Saved even when a later step (signing, packaging)
      # fails, so a retry doesn't start from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check the signing secrets
        env:
          CERTIFICATE_SET: ${{ secrets.APPLE_CERTIFICATE != '' }}
          PASSWORD_SET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          IDENTITY_SET: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          # Report which secrets arrived without printing any of them; a
          # secret that exists but is empty looks the same as a missing one.
          echo "APPLE_CERTIFICATE set: $CERTIFICATE_SET"
          echo "APPLE_CERTIFICATE_PASSWORD set: $PASSWORD_SET (may be empty for a certificate with a blank password)"
          echo "APPLE_SIGNING_IDENTITY set: $IDENTITY_SET"
          echo "Notarization credentials set: $HAS_NOTARY"
          if [[ "$HAS_SIGNING" != true ]]; then
            echo "::warning::Signing is off: APPLE_CERTIFICATE and APPLE_SIGNING_IDENTITY must both be non-empty"
          fi

      # Before building, so a certificate problem shows up in seconds.
      - name: Import the signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/malgel-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          if [[ ! -s "$certificate" ]]; then
            echo "::error::APPLE_CERTIFICATE isn't base64 of a .p12 file"
            exit 1
          fi
          certificate_password="$APPLE_CERTIFICATE_PASSWORD"
          if [[ -z "$certificate_password" ]]; then
            # security import rejects a .p12 with a blank password, so
            # re-wrap it with a random one, in the SHA-1/3DES form every
            # macOS version imports. (OpenSSL 3 needs -legacy to read the
            # RC2 encryption older Keychain Access exports use.)
            certificate_password="$(openssl rand -hex 24)"
            echo "::add-mask::$certificate_password"
            pem="$RUNNER_TEMP/certificate.pem"
            unwrap() {
              openssl pkcs12 -in "$certificate" -passin pass: -nodes -out "$pem" "$@"
            }
            if ! unwrap 2>/dev/null && ! unwrap -legacy; then
              echo "::error::Couldn't open APPLE_CERTIFICATE with a blank password; set APPLE_CERTIFICATE_PASSWORD"
              exit 1
            fi
            openssl pkcs12 -export -in "$pem" -out "$certificate" \
              -passout "pass:$certificate_password" \
              -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
            rm -f "$pem"
          fi
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -f pkcs12 \
            -P "$certificate_password" -T /usr/bin/codesign
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          # Search the new keychain first, keeping the existing ones.
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"
          identities="$(security find-identity -v -p codesigning "$keychain")"
          echo "$identities"
          if ! grep -qiF -- "$APPLE_SIGNING_IDENTITY" <<< "$identities"; then
            echo "::error::The certificate has no valid signing identity named APPLE_SIGNING_IDENTITY; the list above shows what it has"
            exit 1
          fi

      - name: Build a universal binary
        run: |
          # One cargo run for both, so build scripts and proc macros are
          # compiled once and the two builds share every core.
          cargo build --release --locked \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/malgel \
            target/aarch64-apple-darwin/release/malgel \
            target/x86_64-apple-darwin/release/malgel
          lipo -info dist/malgel

      - name: Assemble Malgel.app
        run: packaging/macos/bundle.sh dist/malgel "$VERSION" dist

      - name: Sign Malgel.app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ "$HAS_SIGNING" == true ]]; then
            codesign --force --options runtime --timestamp \
              --keychain "$KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" dist/Malgel.app
          else
            echo "::warning::No signing certificate configured; signing Malgel.app ad hoc"
            codesign --force --sign - dist/Malgel.app
          fi
          codesign --verify --strict --verbose=2 dist/Malgel.app

      - name: Notarize Malgel.app
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: packaging/macos/notarize.sh dist/Malgel.app

      - name: Create the disk image
        run: |
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          ditto dist/Malgel.app "$staging/Malgel.app"
          ln -s /Applications "$staging/Applications"
          # hdiutil occasionally fails with "Resource busy" on hosted runners.
          for attempt in 1 2 3; do
            if hdiutil create -volname Malgel -srcfolder "$staging" -fs HFS+ \
              -format UDZO -ov "dist/$DMG"; then
              break
            fi
            if [[ $attempt == 3 ]]; then exit 1; fi
            sleep 10
          done

      - name: Sign the disk image
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --timestamp --keychain "$KEYCHAIN" \
            --sign "$APPLE_SIGNING_IDENTITY" "dist/$DMG"
          codesign --verify --verbose=2 "dist/$DMG"

      - name: Notarize the disk image
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: packaging/macos/notarize.sh "dist/$DMG"

      - name: Remove the signing keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN" || true

      - name: Attach the disk image to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! command -v gh >/dev/null; then
            brew install gh
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag="$GITHUB_REF_NAME"
            title="Malgel $VERSION"
          else
            tag="v$VERSION-build.$GITHUB_RUN_NUMBER"
            title="Malgel $VERSION test build $GITHUB_RUN_NUMBER"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "$title" --notes "Built from $GITHUB_SHA by run $GITHUB_RUN_ID."
          fi
          gh release upload "$tag" "dist/$DMG" --clobber
          echo "::notice::$DMG is attached to the draft release $tag"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      # aws-lc-sys (TLS for remote images) needs NASM on x86_64 Windows
      # unless it may use its prebuilt objects.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      # Compiled dependencies; see the macOS job.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage Malgel.exe
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/malgel.exe dist/Malgel.exe

      - name: Import the signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP certificate.pfx
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "CERTIFICATE=$certificate" >> $env:GITHUB_ENV
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like '*\x64\*' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Sign Malgel.exe
        if: env.HAS_SIGNING == 'true'
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./packaging/windows/sign.ps1 dist/Malgel.exe

      - name: Create the zip
        run: |
          $name = "Malgel-$env:VERSION-windows-x64"
          $staging = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item dist/Malgel.exe $staging
          foreach ($doc in 'README.md', 'LICENSE', 'LICENSE-MIT', 'LICENSE-APACHE') {
            if (Test-Path $doc) { Copy-Item $doc $staging }
          }
          Compress-Archive -Path $staging -DestinationPath "dist/$name.zip"

      - name: Build the installer
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $dist = (Resolve-Path dist).Path
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceExe=$dist\Malgel.exe" "/DOutputDir=$dist" packaging/windows/malgel.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Sign the installer
        if: env.HAS_SIGNING == 'true'
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./packaging/windows/sign.ps1 "dist/Malgel-$env:VERSION-windows-x64-setup.exe"

      - name: Remove the signing certificate
        if: always() && env.CERTIFICATE != ''
        run: Remove-Item -Force -ErrorAction SilentlyContinue $env:CERTIFICATE

      - uses: actions/upload-artifact@v4
        with:
          name: malgel-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  linux:
    needs: version
    # The oldest supported runner, so the binary runs on older glibc versions.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1
      - uses: dtolnay/rust-toolchain@stable
      # Compiled dependencies; see the macOS job.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --release --locked

      - name: Download linuxdeploy
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/linuxdeploy"

      - name: Package
        env:
          # Runners have no FUSE; AppImages extract themselves instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: LINUXDEPLOY="$RUNNER_TEMP/linuxdeploy" packaging/linux/package.sh target/release/malgel "$VERSION" dist

      - uses: actions/upload-artifact@v4
        with:
          name: malgel-linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  # Collects every package on the draft release the macOS job started: a
  # tag push publishes it, a manual run leaves the test build as a draft.
  release:
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # The same draft the macOS job names.
      TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}-build.{1}', needs.version.outputs.version, github.run_number) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: malgel-*
          path: dist
          merge-multiple: true
      - name: Fetch the macOS disk image
        run: gh release download "$TAG" --pattern '*.dmg' --dir dist
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS.txt
      - name: Attach the packages
        run: gh release upload "$TAG" dist/* --clobber
      - name: Publish the release
        if: github.event_name == 'push'
        run: |
          notes="$(gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body)"
          prerelease=false
          if [[ "$TAG" == *-* ]]; then prerelease=true; fi
          gh release edit "$TAG" --draft=false --prerelease="$prerelease" \
            --title "Malgel ${{ needs.version.outputs.version }}" --notes "$notes"
