# Asks each pull request's authors to agree to the Contributor License
# Agreement (CLA.md) and records who has, in signatures/cla.json on main.
# See CONTRIBUTING.md.
name: CLA

on:
  issue_comment:
    types: [created]
  # pull_request_target runs this workflow from main, never from the pull
  # request, so it can comment and record signatures; it does not check out
  # or run any code from the pull request.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: main
          # The maintainer and bots need not sign.
          allowlist: rcawston,*[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before we can merge it, please
            read the [Malgel Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and agree to it by replying with the comment below. You only
            need to do this once.
          custom-allsigned-prcomment: All contributors have agreed to the Malgel CLA. Thank you!
          signed-commit-message: "$contributorName agreed to the CLA in #$pullRequestNo"
          create-file-commit-message: Start recording CLA signatures
